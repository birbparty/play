name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      NIM_VERSION: 2.2.10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nim toolchain
        shell: bash
        run: |
          nim --version
          nimble --version

      - name: Build desktop examples
        shell: bash
        run: bash scripts/build_desktop_examples.sh --smoke

      - name: Verify Nimble consumer install
        shell: bash
        run: sh tests/consumer/verify_consumer.sh

      - name: Verify path-injected consumer builds
        shell: bash
        run: bash scripts/test_path_consumer.sh

      - name: Install package test dependencies
        shell: bash
        run: nimble install --depsOnly -y

      - name: Prepare desktop test results
        shell: bash
        run: mkdir -p tests/results

      - name: JUnit compile smoke
        shell: bash
        run: nim c --path:src tests/test_soloud_compile.nim

      - name: JUnit raw binding tests
        shell: bash
        run: nim c --path:src -r tests/bindings/test_soloud_raw.nim

      - name: JUnit Vita binding checks
        shell: bash
        run: nim check --path:src -d:playPlatformVita tests/bindings/test_soloud_raw.nim

      - name: JUnit 3DS binding checks
        shell: bash
        run: nim check --path:src -d:playPlatform3ds tests/bindings/test_soloud_raw.nim

      - name: JUnit backend tests
        shell: bash
        run: nim c --path:src -r tests/bindings/test_backends.nim

      - name: JUnit Vita backend checks
        shell: bash
        run: nim check --path:src -d:playPlatformVita tests/bindings/test_backends.nim

      - name: JUnit 3DS backend checks
        shell: bash
        run: nim check --path:src -d:playPlatform3ds tests/bindings/test_backends.nim

      - name: JUnit host stress suite
        shell: bash
        timeout-minutes: 10
        run: nim c --mm:arc --path:src --path:tests "-d:bddyJunit:tests/results/test_host_stress_arc.xml" -r tests/stress/test_host_stress.nim

      - name: JUnit aggregate suite
        if: matrix.os != 'windows-latest'
        shell: bash
        timeout-minutes: 10
        run: nim c --path:src --path:examples --path:tests "-d:bddyJunit:tests/results/test_all.xml" -r tests/test_all.nim

      - name: JUnit Windows isolated suites
        if: matrix.os == 'windows-latest'
        shell: bash
        timeout-minutes: 10
        run: |
          test_files=(
            tests/api/test_assets.nim
            tests/api/test_buses.nim
            tests/api/test_fades.nim
            tests/api/test_handles.nim
            tests/api/test_lifecycle.nim
            tests/api/test_playback.nim
            tests/api/test_public_api.nim
            tests/api/test_types.nim
            tests/examples/test_bus_volume_demo.nim
            tests/examples/test_ds3_audio_probe.nim
            tests/examples/test_example_assets.nim
            tests/examples/test_music_fades.nim
            tests/examples/test_sfx_keypress.nim
            tests/examples/test_vita_audio_probe.nim
            tests/fixtures/test_fixtures.nim
            tests/stress/test_host_stress.nim
            tests/stress/test_realtime_boundary.nim
            tests/test_package_metadata.nim
            tests/wrapper/test_assets.nim
            tests/wrapper/test_buses.nim
            tests/wrapper/test_errors.nim
            tests/wrapper/test_fades.nim
            tests/wrapper/test_handles.nim
            tests/wrapper/test_lifecycle.nim
            tests/wrapper/test_shutdown_stress.nim
            tests/wrapper/test_stream_loop.nim
            tests/wrapper/test_voice_limits.nim
          )

          for test_file in "${test_files[@]}"; do
            result_name=${test_file#tests/}
            result_name=${result_name%.nim}
            result_name=${result_name//\//_}
            echo "::group::$test_file"
            nim c --path:src --path:examples --path:tests "-d:bddyJunit:tests/results/${result_name}.xml" -r "$test_file"
            echo "::endgroup::"
          done

      - name: Upload desktop test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: tests/results/*.xml
          if-no-files-found: error

  nintendo-3ds-examples:
    name: Nintendo 3DS example cross-compile
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      NIM_VERSION: 2.2.10
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C /opt
          echo "/opt/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Nintendo 3DS examples
        run: scripts/build_3ds_examples.sh --out-dir build/3ds

      - name: List Nintendo 3DS artifacts
        run: |
          find build/3ds -maxdepth 1 -type f \( -name '*.3dsx' -o -name '*.elf' \) | sort
          find build/3ds/sdroot/tests/fixtures/generated -maxdepth 1 -type f | sort
          test -s build/3ds/phase1_public_api.3dsx
          test -s build/3ds/bus_volume_demo.3dsx
          test -s build/3ds/music_fades.3dsx
          test -s build/3ds/sfx_keypress.3dsx
          test -s build/3ds/ds3_audio_probe.3dsx
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_sfx.wav
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_music.ogg
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_music_long.ogg

      - name: Upload Nintendo 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nintendo-3ds-artifacts
          path: |
            build/3ds/*.3dsx
            build/3ds/sdroot/**
          if-no-files-found: error

  vita-examples:
    name: Vita example cross-compile
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    env:
      NIM_VERSION: 2.2.10
      VITASDK: /usr/local/vitasdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache ca-certificates curl zip
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C /opt
          echo "/opt/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Vita examples
        run: scripts/build_vita_examples.sh --out-dir build/vita

      - name: List Vita artifacts
        run: |
          find build/vita -maxdepth 1 -type f \( -name '*.vpk' -o -name '*.velf' -o -name '*-eboot.bin' -o -name '*-param.sfo' \) | sort
          test -s build/vita/phase1_public_api.vpk
          test -s build/vita/bus_volume_demo.vpk
          test -s build/vita/music_fades.vpk
          test -s build/vita/sfx_keypress.vpk
          test -s build/vita/vita_audio_probe.vpk

      - name: Upload Vita VPKs
        uses: actions/upload-artifact@v4
        with:
          name: vita-vpks
          path: build/vita/*.vpk
          if-no-files-found: error
