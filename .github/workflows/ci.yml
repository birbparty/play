name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (ubuntu-latest)
    # This job owns the Linux device-free coverage (null-backend smoke +
    # MiniAudio compile guard). macOS audible-backend coverage lives in the
    # separate `desktop-audible-backend` job below, so the Linux-specific steps
    # here (ALSA install, MiniAudio guard) stay free of per-OS conditionals. The
    # Windows desktop passL block in src/play/private/soloud_sources.nim is still
    # best-effort (exercised continue-on-error in that job).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    env:
      NIM_VERSION: 2.2.10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nim toolchain
        shell: bash
        run: |
          nim --version
          nimble --version

      - name: Install ALSA development headers
        shell: bash
        # ALSA headers (alsa/asoundlib.h) are needed at COMPILE time for
        # soloud_miniaudio.cpp's WITH_MINIAUDIO path. sudo is required on the
        # bare ubuntu-latest runner (unlike the root-context 3DS/Vita container
        # jobs, which call apt-get/apk without sudo).
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build desktop examples
        shell: bash
        run: bash scripts/build_desktop_examples.sh --smoke

      - name: Verify Nimble consumer install
        shell: bash
        run: sh tests/consumer/verify_consumer.sh

      - name: Verify path-injected consumer builds
        shell: bash
        run: bash scripts/test_path_consumer.sh

      - name: Install package test dependencies
        shell: bash
        run: nimble install --depsOnly -y

      - name: Prepare desktop test results
        shell: bash
        run: mkdir -p tests/results

      - name: JUnit compile smoke
        shell: bash
        run: nim c --path:src tests/test_soloud_compile.nim

      - name: Desktop miniaudio backend compile guard
        shell: bash
        # Proves WITH_MINIAUDIO (soloud_miniaudio.cpp + miniaudio.h) is compiled
        # into the desktop closure. Needs libasound2-dev (installed above) but no
        # audio device. Runs (-r) to assert the backend is wired, not just built.
        run: nim c --path:src -r tests/test_desktop_backend_compile.nim

      - name: JUnit raw binding tests
        shell: bash
        run: nim c --path:src -r tests/bindings/test_soloud_raw.nim

      - name: JUnit Vita binding checks
        shell: bash
        run: nim check --path:src -d:playPlatformVita tests/bindings/test_soloud_raw.nim

      - name: JUnit 3DS binding checks
        shell: bash
        run: nim check --path:src -d:playPlatform3ds tests/bindings/test_soloud_raw.nim

      - name: JUnit backend tests
        shell: bash
        run: nim c --path:src -r tests/bindings/test_backends.nim

      - name: JUnit Vita backend checks
        shell: bash
        run: nim check --path:src -d:playPlatformVita tests/bindings/test_backends.nim

      - name: JUnit 3DS backend checks
        shell: bash
        run: nim check --path:src -d:playPlatform3ds tests/bindings/test_backends.nim

      - name: JUnit host stress suite
        shell: bash
        timeout-minutes: 10
        run: nim c --mm:arc --path:src --path:tests "-d:bddyJunit:tests/results/test_host_stress_arc.xml" -r tests/stress/test_host_stress.nim

      - name: JUnit aggregate suite
        shell: bash
        timeout-minutes: 10
        run: nim c --path:src --path:examples --path:tests "-d:bddyJunit:tests/results/test_all.xml" -r tests/test_all.nim

      - name: Upload desktop test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: tests/results/*.xml
          if-no-files-found: error

  desktop-audible-backend:
    # Asserts that desktop `init(AUTO)` resolves to an AUDIBLE backend (not the
    # silent NoSound fallback) on each desktop OS that ships an audio device.
    # This is the regression gate for the macOS CoreAudio backend fix: a future
    # backend reorder, miniaudio bump, or dropped framework that re-introduced
    # silent NoSound would fail here instead of shipping silently.
    #
    # macOS is a HARD gate (PLAY_REQUIRE_AUDIBLE=1) because GitHub's macOS
    # runners expose a CoreAudio device. Windows is best-effort
    # (continue-on-error) since runner audio availability is less certain.
    #
    # ROLLBACK LEVER: if macos-latest ever fails to open CoreAudio reliably, set
    # its `require_audible` to "" below to demote it to informational (Part A,
    # the device-free compiled-backend guard, still runs and stays enforced).
    name: Desktop audible backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            require_audible: "1"
          - os: windows-latest
            require_audible: ""
    env:
      NIM_VERSION: 2.2.10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Nim toolchain
        shell: bash
        run: |
          nim --version
          nimble --version

      - name: Build desktop examples (compile closure on this OS)
        shell: bash
        run: bash scripts/build_desktop_examples.sh --smoke

      - name: Assert desktop AUTO resolves to an audible backend
        shell: bash
        # Part A (always): compiled-backend-set guard, device-free. Part B
        # (gated by PLAY_REQUIRE_AUDIBLE): hard-asserts init(AUTO) is audible on
        # macOS; informational elsewhere.
        env:
          PLAY_REQUIRE_AUDIBLE: ${{ matrix.require_audible }}
        run: nim c --path:src -r tests/test_desktop_audible_backend.nim

  nintendo-3ds-examples:
    name: Nintendo 3DS example cross-compile
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      NIM_VERSION: 2.2.10
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C /opt
          echo "/opt/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Nintendo 3DS examples
        run: scripts/build_3ds_examples.sh --out-dir build/3ds

      - name: List Nintendo 3DS artifacts
        run: |
          find build/3ds -maxdepth 1 -type f \( -name '*.3dsx' -o -name '*.elf' \) | sort
          find build/3ds/sdroot/tests/fixtures/generated -maxdepth 1 -type f | sort
          test -s build/3ds/phase1_public_api.3dsx
          test -s build/3ds/bus_volume_demo.3dsx
          test -s build/3ds/music_fades.3dsx
          test -s build/3ds/sfx_keypress.3dsx
          test -s build/3ds/ds3_audio_probe.3dsx
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_sfx.wav
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_music.ogg
          test -s build/3ds/sdroot/tests/fixtures/generated/tone_music_long.ogg

      - name: Upload Nintendo 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nintendo-3ds-artifacts
          path: |
            build/3ds/*.3dsx
            build/3ds/sdroot/**
          if-no-files-found: error

  vita-examples:
    name: Vita example cross-compile
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    env:
      NIM_VERSION: 2.2.10
      VITASDK: /usr/local/vitasdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache ca-certificates curl zip
          curl -fsSL "https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C /opt
          echo "/opt/nim-${NIM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Vita examples
        run: scripts/build_vita_examples.sh --out-dir build/vita

      - name: List Vita artifacts
        run: |
          find build/vita -maxdepth 1 -type f \( -name '*.vpk' -o -name '*.velf' -o -name '*-eboot.bin' -o -name '*-param.sfo' \) | sort
          test -s build/vita/phase1_public_api.vpk
          test -s build/vita/bus_volume_demo.vpk
          test -s build/vita/music_fades.vpk
          test -s build/vita/sfx_keypress.vpk
          test -s build/vita/vita_audio_probe.vpk

      - name: Upload Vita VPKs
        uses: actions/upload-artifact@v4
        with:
          name: vita-vpks
          path: build/vita/*.vpk
          if-no-files-found: error
