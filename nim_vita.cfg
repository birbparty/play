# nim_vita.cfg - PS Vita build config for play.
#
# This file is not auto-loaded by Nim. Follow clckr's convention: build scripts
# copy this file to nim.cfg at the repo root before invoking:
#   nim c -d:vita <entrypoint.nim>
#
# Relative paths below are repo-root-relative and assume the command is run from
# the repository root.

# Target VitaSDK's arm-vita-eabi toolchain through Nim's arm/linux config keys.
--cpu:arm
--os:linux

# Console runtime profile. The Vita backend runs native C++ audio code and must
# not depend on Nim runtime threads entering audio callbacks.
--threads:off
--mm:arc
--define:useMalloc
--define:nimAllocPagesViaMalloc
--define:noSignalHandler
--opt:size

# Library sources and future repo-root-relative support directories. Vita builds
# may create local empty archives in the repo root for POSIX libraries Nim
# references but VitaSDK lacks, mirroring clckr's build-script convention.
--path:"src"
--passL:"-L."

# C and C++ toolchain. Nim's C backend invokes the gcc driver for `{.compile.}`
# C++ files and chooses the language from the .cpp extension; the cpp keys are
# kept for tools and future Nim behavior, but the active link path uses gcc plus
# explicit C++ runtime libraries.
cc = "gcc"
arm.linux.gcc.path = "/usr/local/vitasdk/bin"
arm.linux.gcc.exe = "arm-vita-eabi-gcc"
arm.linux.gcc.linkerexe = "arm-vita-eabi-gcc"
arm.linux.gcc.cpp.exe = "arm-vita-eabi-g++"
arm.linux.gcc.cpp.linkerexe = "arm-vita-eabi-g++"

# VitaSDK headers. arm-vita-eabi-gcc already selects the correct ARMv7 hard-float
# profile, so do not reuse 3DS armv6k flags here.
--passC:"-I/usr/local/vitasdk/arm-vita-eabi/include"

# SoLoud C++ compile units. Nim 2.2 applies --passC to external .cpp files under
# `nim c`; gcc.cpp.options.always is not applied in that compile model.
--passC:"-fno-exceptions -fno-rtti -std=gnu++11"

# vita-elf-create needs retained relocations for real hardware load addresses.
--passL:"-Wl,-q"
--passL:"-L/usr/local/vitasdk/arm-vita-eabi/lib"

# Vita audio backend and core C/C++ runtime libraries. Later example-packaging
# scripts can append graphics or packaging stubs as needed.
--passL:"-lSceAudio_stub"
--passL:"-Wl,--start-group -lc -lm -lstdc++ -lpthread -lSceLibKernel_stub -lSceKernelThreadMgr_stub -lSceIofilemgr_stub -lSceProcessmgr_stub -Wl,--end-group"
