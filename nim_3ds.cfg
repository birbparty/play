# nim_3ds.cfg - Nintendo 3DS build config for play.
#
# This file is not auto-loaded by Nim. Follow clckr's convention: build scripts
# copy this file to nim.cfg at the repo root before invoking:
#   nim c -d:ds3 <entrypoint.nim>
#
# Relative paths below are repo-root-relative and assume the command is run from
# the repository root.

# Target devkitARM's newlib environment. The arm.linux.gcc.* keys are inert
# until both target selectors are present.
--cpu:arm
--os:linux

# Nim runtime profile for libctru. devkitARM has no pthreads, and Nim's default
# allocator expects mmap-like primitives that newlib does not provide.
--threads:off
--mm:arc
--define:useMalloc
--define:nimAllocPagesViaMalloc
--define:noSignalHandler
--opt:size

# Library sources and future repo-root-relative support directories.
--path:"src"
--passL:"-Lstubs"

# C and C++ toolchain. SoLoud is compiled as C++ through Nim's C backend, so the
# cpp keys are required even though consumers keep using `nim c`.
cc = "gcc"
arm.linux.gcc.path = "/opt/devkitpro/devkitARM/bin"
arm.linux.gcc.exe = "arm-none-eabi-gcc"
arm.linux.gcc.linkerexe = "arm-none-eabi-gcc"
arm.linux.gcc.cpp.exe = "arm-none-eabi-g++"
arm.linux.gcc.cpp.linkerexe = "arm-none-eabi-g++"

# 3DS architecture and libctru headers.
--passC:"-specs=3dsx.specs"
--passC:"-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft"
--passC:"-D__3DS__ -DARM11"
--passC:"-I/opt/devkitpro/libctru/include"

# SoLoud C++ compile units. Keep exceptions and RTTI disabled for size and to
# match the intended console profile. Use cpp options rather than --passC so
# Nim's generated C files are not compiled as C++.
gcc.cpp.options.always %= "${gcc.cpp.options.always} -fno-exceptions -fno-rtti -std=gnu++11"

# Link through g++ and include the C++ runtime explicitly. Link order matters for
# single-pass GNU ld: project/object files first, then C++ runtime and libctru.
--passL:"-specs=3dsx.specs -march=armv6k -mtune=mpcore -mfloat-abi=hard"
--passL:"-L/opt/devkitpro/libctru/lib"
--passL:"-lstdc++ -lctru -lm"
